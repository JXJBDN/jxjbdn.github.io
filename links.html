<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>友链 · 就像戒不掉你</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark"><img src="logo.jpg" alt="就像戒不掉你"></span>
      <span class="brand-name">就像戒不掉你</span>
    </a>
    <nav class="main-nav">
      <a href="index.html" class="nav-link">首页</a>
      <a href="blog.html" class="nav-link">日记</a>
      <a href="photos.html" class="nav-link">相册</a>
      <span class="nav-link nav-off">留言板<span class="mini-badge">未开放</span></span>
      <a href="links.html" class="nav-link nav-now">友链</a>
      <a href="about.html" class="nav-link">关于作者</a>
    </nav>
    <div class="header-actions">
      <span class="search-off" title="搜索 · 未开放">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      </span>
      <a href="edit.html" class="btn-upload">＋ 上传日记</a>
    </div>
  </div>
</header>

<main>
  <div class="links-wrap">

    <section class="editor-hero">
      <div class="ed-date">友链 · 门前的路</div>
      <h1>去朋友们的网站逛逛</h1>
      <p>这里收录我喜欢的站点 · 想交换友链就来找我</p>
    </section>

    <div class="links-grid" id="linksGrid"></div>
    <div class="links-empty" id="linksEmpty" hidden>
      还没有友链——站长可以在「＋ 上传日记」页面的「友链管理」里添加。
    </div>

  </div>
</main>

<footer class="site-footer">
  <p>暂无备案号等信息<span class="dot">·</span>住在 GitHub Pages<span class="dot">·</span>始于 2026.08.18</p>
</footer>

<script>
  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  fetch('links.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) { throw new Error('还没有友链数据'); }
      return r.json();
    })
    .then(function (obj) {
      var items = (obj && Array.isArray(obj.items)) ? obj.items : [];
      var grid = document.getElementById('linksGrid');
      if (!items.length) {
        document.getElementById('linksEmpty').hidden = false;
        return;
      }
      items.forEach(function (it) {
        var a = document.createElement('a');
        a.className = 'link-card';
        a.href = it.url;
        a.target = '_blank';
        a.rel = 'noopener';
        a.innerHTML =
          '<span class="link-avatar">' + esc((it.name || '友').charAt(0)) + '</span>' +
          '<span class="link-info"><b>' + esc(it.name) + '</b>' +
          (it.desc ? '<span>' + esc(it.desc) + '</span>' : '<span>' + esc(it.url) + '</span>') +
          '</span>';
        grid.appendChild(a);
      });
    })
    .catch(function () {
      document.getElementById('linksEmpty').hidden = false;
    });
</script>

</body>
</html>
