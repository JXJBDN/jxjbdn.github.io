<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>相册 · 就像戒不掉你</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark"><img src="logo.jpg" alt="就像戒不掉你"></span>
      <span class="brand-name">就像戒不掉你</span>
    </a>
    <nav class="main-nav">
      <a href="index.html" class="nav-link">首页</a>
      <a href="blog.html" class="nav-link">日记</a>
      <a href="photos.html" class="nav-link nav-now">相册</a>
      <span class="nav-link nav-off">留言板<span class="mini-badge">未开放</span></span>
      <a href="links.html" class="nav-link">友链</a>
      <a href="about.html" class="nav-link">关于作者</a>
    </nav>
    <div class="header-actions">
      <span class="search-off" title="搜索 · 未开放">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      </span>
      <a href="edit.html" class="btn-upload">＋ 上传日记</a>
    </div>
  </div>
</header>

<main>
  <div class="photos-wrap">

    <section class="editor-hero">
      <div class="ed-date">相册 · 生活的碎片</div>
      <h1>日记里的图和视频，都住在这里</h1>
      <p>写日记时插入的图片和视频会自动收进相册</p>
    </section>

    <div class="tag-bar gallery-tabs">
      <button class="tag active" data-g="image" type="button">图片</button>
      <button class="tag" data-g="video" type="button">视频</button>
    </div>

    <div class="photos-grid" id="photosGrid"></div>
    <div class="photos-empty" id="photosEmpty" hidden></div>

  </div>
</main>

<footer class="site-footer">
  <p>暂无备案号等信息<span class="dot">·</span>住在 GitHub Pages<span class="dot">·</span>始于 2026.08.18</p>
</footer>

<div class="lightbox" id="lightbox"><img id="lightboxImg" src="" alt=""></div>

<script>
  function esc(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  var ALL_ITEMS = [];
  var currentTab = 'image';
  var grid = document.getElementById('photosGrid');
  var emptyBox = document.getElementById('photosEmpty');
  var box = document.getElementById('lightbox');
  var boxImg = document.getElementById('lightboxImg');

  /* 旧数据没有 type 字段，一律当图片（兼容 gallery.json 的历史记录） */
  function kindOf(it) { return it.type === 'video' ? 'video' : 'image'; }

  function render() {
    var items = ALL_ITEMS.filter(function (it) { return kindOf(it) === currentTab; });
    grid.innerHTML = '';
    if (!items.length) {
      emptyBox.hidden = false;
      emptyBox.textContent = currentTab === 'video'
        ? '还没有视频——写日记时插入视频（≤15MB），它会自动出现在这里。'
        : '相册还空着——去写一篇带图片的日记，照片就会出现在这里。';
      return;
    }
    emptyBox.hidden = true;
    items.forEach(function (it) {
      var card = document.createElement('div');
      card.className = 'photo-card';
      var title = esc(it.title || '无题');
      if (kindOf(it) === 'video') {
        card.innerHTML =
          '<video src="' + esc(it.src) + '" controls preload="metadata" playsinline></video>' +
          '<div class="photo-cap"><b>《' + title + '》</b>' +
          '<span>' + esc(it.wroteAt || '') + '</span>' +
          (it.post ? '<a href="' + esc(it.post) + '">来自这篇日记 →</a>' : '') +
          '</div>';
      } else {
        card.innerHTML =
          '<img src="' + esc(it.src) + '" alt="' + title + '" loading="lazy">' +
          '<div class="photo-cap"><b>《' + title + '》</b>' +
          '<span>' + esc(it.wroteAt || '') + '</span>' +
          (it.post ? '<a href="' + esc(it.post) + '">来自这篇日记 →</a>' : '') +
          '</div>';
        card.querySelector('img').addEventListener('click', function () {
          boxImg.src = it.src;
          box.classList.add('open');
        });
      }
      grid.appendChild(card);
    });
  }

  document.querySelectorAll('.gallery-tabs .tag').forEach(function (btn) {
    btn.addEventListener('click', function () {
      document.querySelectorAll('.gallery-tabs .tag').forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      currentTab = btn.dataset.g;
      render();
    });
  });

  box.addEventListener('click', function () {
    box.classList.remove('open');
    boxImg.src = '';
  });

  fetch('gallery.json?t=' + Date.now(), { cache: 'no-store' })
    .then(function (r) {
      if (!r.ok) { throw new Error('还没有相册数据'); }
      return r.json();
    })
    .then(function (obj) {
      ALL_ITEMS = (obj && Array.isArray(obj.items)) ? obj.items : [];
      render();
    })
    .catch(function () {
      emptyBox.hidden = false;
      emptyBox.textContent = '相册还空着——去写一篇带图片或视频的日记，它们就会出现在这里。';
    });
</script>

<script src="announcement.js"></script>
<script src="fx.js"></script>
</body>
</html>
