<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>博客 · 就像戒不掉你</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <a class="brand" href="index.html">
      <span class="brand-mark"><img src="logo.jpg" alt="就像戒不掉你"></span>
      <span class="brand-name">就像戒不掉你</span>
    </a>
    <nav class="main-nav">
      <a href="index.html" class="nav-link">首页</a>
      <a href="blog.html" class="nav-link active">博客</a>
      <span class="nav-link nav-off">相册<span class="mini-badge">未开放</span></span>
      <span class="nav-link nav-off">留言板<span class="mini-badge">未开放</span></span>
      <a href="about.html" class="nav-link">关于作者</a>
    </nav>
    <div class="header-actions">
      <span class="search-off" title="搜索 · 未开放">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
      </span>
    </div>
  </div>
</header>

<main>
  <div class="wrap">

    <section class="page-hero">
      <h1>日记</h1>
      <p>把日子写成文章 · 目前共 1 篇</p>
    </section>

    <div class="tag-bar">
      <button class="tag active" data-filter="全部">全部</button>
      <button class="tag" data-filter="生活">生活</button>
      <button class="tag" data-filter="建站">建站</button>
      <span class="tag tag-off">旅行<span class="mini-badge">未开放</span></span>
      <span class="tag tag-off">书影<span class="mini-badge">未开放</span></span>
    </div>

    <section class="cards">

      <a class="card-item" data-tags="建站" href="post-1.html">
        <div class="card-head">
          <span class="date-stamp">2026.08.18</span>
          <span class="chip chip-soft">#建站</span>
        </div>
        <h3 class="card-title">我的网站出生了</h3>
        <p class="card-excerpt">从 VSCode 里一个随便写的 HTML 文件开始。我本来只是想试试「网页是怎么做出来的」，写了点歌词，写了句「张家硕尝试自制网站」，然后把它传上了 GitHub……</p>
        <span class="read-more">阅读全文 →</span>
      </a>

      <div class="card-item card-dashed">
        <h3 class="card-title">第二篇文章会出现在这里</h3>
        <p class="card-excerpt">说不定就是你这周随手记下的某一句话 ✎</p>
      </div>

    </section>

  </div>
</main>

<footer class="site-footer">
  <p>暂无备案号等信息<span class="dot">·</span>住在 GitHub Pages<span class="dot">·</span>始于 2026.08.18</p>
</footer>

<script>
  var tagBtns = document.querySelectorAll('.tag[data-filter]');
  var cards = document.querySelectorAll('.card-item');
  tagBtns.forEach(function (btn) {
    btn.addEventListener('click', function () {
      tagBtns.forEach(function (b) { b.classList.remove('active'); });
      btn.classList.add('active');
      var f = btn.dataset.filter;
      cards.forEach(function (card) {
        card.style.display = (f === '全部' || card.dataset.tags.indexOf(f) > -1) ? '' : 'none';
      });
    });
  });
</script>

</body>
</html>
